<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi lista de tareas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <style>

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 60px 20px;
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #0d1117;
      background-image: radial-gradient(circle at 20% 20%, rgba(61,131,255,0.12), transparent 40%),
                         radial-gradient(circle at 80% 30%, rgba(255,199,71,0.10), transparent 40%);
      color: #e6edf3;
    }

    h1 {
      text-align: center;
      font-family: 'Space Grotesk', 'Segoe UI', sans-serif;
      font-size: 32px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #2dd4bf 10%, #a78bfa 90%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: #ffffff;
    }

    .encabezado {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 30px;
    }

    body {
      position: relative;
      overflow-x: hidden;
    }

    .icono-flotante {
      position: absolute;
      opacity: 0.16;
      pointer-events: none;
      z-index: 0;
    }

    .contenedor {
      width: 100%;
      max-width: 480px;
      background-color: #161b22;
      border: 1px solid #2a3140;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 0 30px rgba(61,131,255,0.15);
      position: relative;
      z-index: 1;
    }

    .fila-input {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 25px;
      align-items: center;
    }

    #fecha-input {
      display: none;
    }

    #tarea-input,
    #fecha-input {
      flex: 1;
      min-width: 140px;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #2a3140;
      background-color: #0d1117;
      color: #e6edf3;
      font-size: 14px;
      outline: none;
      transition: 0.2s;
      color-scheme: dark;
    }

    #tarea-input:focus,
    #fecha-input:focus {
      border-color: #3d83ff;
      box-shadow: 0 0 12px rgba(61,131,255,0.5);
    }

    #btn-agregar {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background-color: #f6c343;
      color: #1a1400;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    #btn-agregar:hover {
      box-shadow: 0 0 16px rgba(246,195,67,0.6);
      transform: translateY(-1px);
    }

    label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #8891a8;
      white-space: nowrap;
    }

    #lista-tareas {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    #lista-tareas li {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
      background-color: #0d1117;
      border: 1px solid #2a3140;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 10px;
      font-size: 14px;
      transition: 0.2s;
    }

    #lista-tareas li[contenteditable="true"] {
      outline: none;
      border-color: #f6c343;
      box-shadow: 0 0 12px rgba(246,195,67,0.4);
    }

    #lista-tareas li.completada .nombre-tarea {
      text-decoration: line-through;
      color: #6e7681;
    }

    .texto-tarea {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .nombre-tarea {
      overflow-wrap: break-word;
    }

    .fecha-tag {
      font-size: 12px;
      color: #6e7681;
    }

    .acciones {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    #lista-tareas button {
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      color: white;
      min-width: 78px;
      text-align: center;
      transition: 0.2s;
    }

    .btn-completar {
      background-color: #3d83ff;
    }

    .btn-completar:hover {
      box-shadow: 0 0 10px rgba(61,131,255,0.7);
    }

    .btn-editar {
      background-color: #f6c343;
      color: #1a1400;
    }

    .btn-editar:hover {
      box-shadow: 0 0 10px rgba(246,195,67,0.7);
    }

    .btn-eliminar {
      background-color: #e5484d;
    }

    .btn-eliminar:hover {
      box-shadow: 0 0 10px rgba(229,72,77,0.7);
    }

  </style>
</head>

  <svg class="icono-flotante" style="top: 68%; left: 20%;" width="30" height="30" viewBox="0 0 34 34">

  <svg class="icono-flotante" style="top: 70%; right: 20%;" width="40" height="40" viewBox="0 0 70 70">

  <svg class="icono-flotante" style="top: 15%; left: 22%;" width="26" height="26" viewBox="0 0 34 34">
    <path d="M17 2 L4 20 H15 L11 32 L30 12 H18 Z" fill="none" stroke="#2dd4bf" stroke-width="2.5" stroke-linejoin="round"/>
  </svg>

  <svg class="icono-flotante" style="top: 18%; right: 24%;" width="28" height="28" viewBox="0 0 55 55">
    <path d="M10 45 L14 32 L38 8 L47 17 L23 41 Z" fill="none" stroke="#a78bfa" stroke-width="3" stroke-linejoin="round"/>
    <line x1="31" y1="15" x2="40" y2="24" stroke="#a78bfa" stroke-width="3"/>

  <div class="contenedor">
    <div class="encabezado">
      <svg width="34" height="34" viewBox="0 0 34 34">
        <rect x="2" y="2" width="30" height="30" rx="8" fill="none" stroke="url(#gradLogo)" stroke-width="3"/>
        <path d="M9 17 L14 22 L25 10" fill="none" stroke="url(#gradLogo)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <defs>
          <linearGradient id="gradLogo" x1="0" y1="0" x2="34" y2="34">
            <stop offset="0%" stop-color="#2dd4bf"/>
            <stop offset="100%" stop-color="#a78bfa"/>
          </linearGradient>
        </defs>
      </svg>
      <h1>Mi lista de tareas</h1>
    </div>
    <div class="fila-input">
      <input type="text" id="tarea-input">
      <input type="datetime-local" id="fecha-input">
      <button id="btn-agregar">Agregar</button>
      <label><input type="checkbox" id="mostrar-fecha"> Agregar fecha</label>
    </div>
    <ul id="lista-tareas"></ul>
  </div>
  <script>
    const boton = document.getElementById("btn-agregar");
    const lista = document.getElementById("lista-tareas");
    const input = document.getElementById("tarea-input");
    const fechaInput = document.getElementById("fecha-input");
    const mostrarFecha = document.getElementById("mostrar-fecha");

    // Recuerda cuál tarea está en modo edición ahora mismo (o null si ninguna)
    let tareaEnEdicion = null;

    function agregarTarea(){
      const texto = input.value.trim();
      if (texto === "") {
        return; // No agregar tareas vacías
      }

      let fechaRaw = fechaInput.value;
      let fechaHTML = "";
      let atributoFecha = "";

      if (mostrarFecha.checked && fechaRaw !== "") {
        const fechaObj = new Date(fechaRaw);
        const fechaLegible = fechaObj.toLocaleString('es-MX', {
          day: '2-digit',
          month: '2-digit',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });
        fechaHTML = "<span class='fecha-tag'>📅 " + fechaLegible + "</span>";
        atributoFecha = " data-fecha='" + fechaRaw + "'";
      }

      lista.insertAdjacentHTML("beforeend", "<li" + atributoFecha + "><span class='texto-tarea'>" +
        "<span class='nombre-tarea'>" + texto + "</span>" +
        fechaHTML +
        "</span>" +
        "<div class='acciones'>" +
        "<button class='btn-completar'>Completar</button>" +
        "<button class='btn-eliminar'>Eliminar</button>" +
        "<button class='btn-editar'>Editar</button>" +
        "</div></li>");

      ordenarConAnimacion();

      input.value = "";
      fechaInput.value = "";
    }

    // Devuelve la fecha de un <li> en milisegundos, o Infinity si no tiene
    // (así, al ordenar de menor a mayor, las tareas sin fecha quedan al final)
    function obtenerFechaMs(li) {
      const fechaAttr = li.dataset.fecha;
      return fechaAttr ? new Date(fechaAttr).getTime() : Infinity;
    }

    // Reordena la lista (pendientes por fecha, completadas al final) con animación de deslizamiento
    function ordenarConAnimacion() {
      const items = Array.from(lista.children);

      // 1. FIRST: guardamos dónde está cada tarea ahora mismo
      const posicionesViejas = new Map();
      items.forEach(function(li) {
        posicionesViejas.set(li, li.getBoundingClientRect().top);
      });

      // Separamos pendientes (ordenadas por fecha) de completadas (van al final)
      const pendientes = items.filter(function(li) { return !li.classList.contains("completada"); });
      const completadas = items.filter(function(li) { return li.classList.contains("completada"); });
      pendientes.sort(function(a, b) { return obtenerFechaMs(a) - obtenerFechaMs(b); });
      const nuevoOrden = pendientes.concat(completadas);

      // 2. LAST: los movemos de golpe a su posición final real
      nuevoOrden.forEach(function(li) { lista.appendChild(li); });

      // 3. INVERT + 4. PLAY: por cada uno, calculamos cuánto se movió y animamos el regreso
      nuevoOrden.forEach(function(li) {
        const posVieja = posicionesViejas.get(li);
        const posNueva = li.getBoundingClientRect().top;
        const delta = posVieja - posNueva;

        if (delta !== 0) {
          li.style.transition = "none";
          li.style.transform = "translateY(" + delta + "px)";

          requestAnimationFrame(function() {
            li.style.transition = "transform 0.35s ease";
            li.style.transform = "";
          });
        }
      });
    }

    boton.addEventListener("click", agregarTarea);

    // Muestra u oculta el selector de fecha según el checkbox
    mostrarFecha.addEventListener("change", function() {
      fechaInput.style.display = mostrarFecha.checked ? "block" : "none";
    });

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        agregarTarea();
      }
    });

    lista.addEventListener("click", function(event) {
      // .closest("li") encuentra el <li> más cercano hacia arriba,
      // sin importar si el clic fue en el botón o en algo dentro de él
      const tarea = event.target.closest("li");

      if (event.target.classList.contains("btn-completar")) {
        tarea.classList.toggle("completada");
        ordenarConAnimacion();
      }

      if (event.target.classList.contains("btn-eliminar")) {
        tarea.remove();
      }

      if (event.target.classList.contains("btn-editar")) {
        // Si ya había otra tarea en edición y no es esta, la apagamos primero
        if (tareaEnEdicion && tareaEnEdicion !== tarea) {
          tareaEnEdicion.contentEditable = "false";
        }

        if (tarea.contentEditable === "true") {
          tarea.contentEditable = "false";
          tareaEnEdicion = null;
        } else {
          tarea.contentEditable = "true";
          tarea.focus();
          tareaEnEdicion = tarea;
        }
      }
    });

    // Respaldo: si el usuario hace clic fuera sin usar el botón Editar, también se apaga
    lista.addEventListener("focusout", function(event) {
      if (event.target.tagName === "LI") {
        event.target.contentEditable = "false";
        if (tareaEnEdicion === event.target) {
          tareaEnEdicion = null;
        }
      }
    });
  </script>
</body>
</html>
